[build-system]
requires = ["setuptools >= 61.0.0", "setuptools_scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spherex-pipelines"
description = "SPHEREx data processing pipelines"
readme = "README.md"
authors = [
    {name="Caltech/IPAC SPHEREx Team"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.11.0"
dependencies = [
    "alive-progress",
    "astropy",
    "opencv-python-headless",
    "click >8.3.0",
    "gwcs",
    "healpy >=1.17.1",
    "joblib",
    "kete<2.0",
    "lsst_ctrl_mpexec",
    "lsst_pipe_base",
    "lsst_daf_butler[postgres]",
    "matplotlib",
    "numba",
    "numpy",
    "parsl",
    "photutils",
    "pyarrow",
    "pydantic >=2.3, <3.0",
    "reproject",
    "scipy >=1.6",
    "scikit-image",
    "scikit-learn",
    "slack_sdk",
    "sqlalchemy",
    "spiceypy",
    "tenacity",
    "regions",
    "sep",
    "tqdm",
]
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/IPAC-SW/spherex-pipelines"

[project.optional-dependencies]
test = [
    "pytest >= 3.2",
    "pytest-xdist",
    "pytest-cov",
    "ruff>=0.15.1",
]
docs = [
    "spherex-sphinx @ git+https://github.com/SPHEREx/spherex-sphinx.git@main",
]
extra = [
    "spherex-parameters @ git+https://github.com/SPHEREx/SPHEREx-Parameters@main",
    "spherex_sky_simulator @ git+https://github.com/SPHEREx/SPHEREx-Sky-Simulator@main#subdirectory=py"
]
tractor = [
    "tractor @ git+https://github.com/Caltech-IPAC/tractor-spherex.git@main",
]

[project.scripts]
plan-tools = "spx_apps.plan_tools.script.cli_plan_tools:cli"
photometry-tool = "spx_apps.photometry_tool.script.cli_photometry_tool:main"
mosaic-tool = "spx_apps.mosaic_tool.script.cli_mosaic_tool:main"
[tool.setuptools.packages.find]
where = ["py_src"]

[tool.setuptools]
zip-safe = true

[tool.setuptools.package-data]
spx_butler = ["configs/*.yaml", "configs/*/*.yaml", "cli/*.yaml"]
spx_data = ["data/*.fits", "data/*.fits.gz"]
spx_utils = ["astrometry/*.sex", "astrometry/*.param", "astrometry/*.conf", "data/*.csv"]
spx_apps = ["*/data/*.vot", "*/data/*.yaml"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
tag_regex = "^(?P<version>\\d+\\.\\d+\\.\\d+(?:(?:a|b|rc)\\d+)?)$"
git_describe_command = "git describe --dirty --tags --long --match [0-9]*.[0-9]*.[0-9]*"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--ignore=tools/template", "--strict-markers"]
markers = [
    "optional_deps: needs an optional dependency (spherex-parameters or spherex-sky-simulator)",
]

[tool.towncrier]
    version = ""
    package_dir = "py_src"
    filename = "CHANGES.md"
    directory = "docs/changes"
    start_string = "<!-- towncrier release notes start -->\n"
    underlines = ["", "", ""]
    title_format = "## SPHEREx Pipelines {version} ({project_date})"
    issue_format = "[[#{issue}](https://jira.ipac.caltech.edu/browse/{issue})]"
    template = "docs/changes/template.jinja"
    [[tool.towncrier.type]]
        directory = "new"
        name = "New Features"
        showcontent = true
    [[tool.towncrier.type]]
        directory = "change"
        name = "Changes"
        showcontent = true
    [[tool.towncrier.type]]
        directory = "bugfix"
        name = "Bug Fixes"
        showcontent = true
    [[tool.towncrier.type]]
        directory = "perf"
        name = "Enhancements"
        showcontent = true
    [[tool.towncrier.type]]
        directory = "other"
        name = "Other"
        showcontent = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
    "__init__.py",
    "docs",
    "*.ipynb",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D101", "D103"]

# docs.astral.sh/ruff/rules
[tool.ruff.lint]
ignore = [
    "N802",
    "N803",
    "N806",
    "N812",
    "N815",
    "N816",
    "N999",
    "D107",
    "D105",
    "D102",
    "D104",
    "D100",
    "D200",
    "D205",
    "D400",
    "UP007",  # Allow UNION in type annotation
]
select = [
    "E",  # pycodestyle
    "F",  # pycodestyle
    "N",  # pep8-naming
    "W",  # pycodestyle
    "D",  # pydocstyle
#    "UP",  # TODO: pyupgrade
#    "I",  # TODO: isort
#    "RUF022",  # TODO: sort __all__
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.coverage.report]
exclude_also = [
    # NOTE: coverage instruments Python bytecode and cannot see Numba JIT-compiled
    #       machine code. Functions decorated with @njit should still be unit
    #       unit tested to verify JIT compilation, but can use this pragma.
    "# pragma: not-coverage-visible"
]